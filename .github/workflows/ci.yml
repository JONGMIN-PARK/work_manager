name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: work_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/work_manager_test
        run: |
          cd server
          for f in ../migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f" 2>/dev/null || true
          done
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f" 2>/dev/null || true
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/work_manager_test
          JWT_SECRET: test-jwt-secret-ci
          JWT_REFRESH_SECRET: test-refresh-secret-ci
          NODE_ENV: test
        run: cd server && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}" || echo "Deploy hook not configured"
