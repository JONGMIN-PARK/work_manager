<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>업무 관리자</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:'Malgun Gothic','Segoe UI',sans-serif;background:radial-gradient(1200px 600px at 20% 0%,#1e3a8a 0%,#0f1220 55%);color:#e5e7eb;display:grid;place-items:center;user-select:none}
  .box{text-align:center;max-width:420px;padding:24px}
  img{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 40px rgba(37,99,235,.45)}
  h2{margin:20px 0 6px;font-size:20px}
  p{color:#9ca3af;font-size:14px;line-height:1.6;margin:0 0 18px}
  .bar{height:4px;border-radius:2px;background:#1f2937;overflow:hidden;margin:0 auto 18px;width:220px}
  .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2563EB,#7C3AED);animation:mv 1.2s ease-in-out infinite}
  @keyframes mv{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  button{padding:10px 22px;border-radius:10px;border:0;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .err .bar{display:none}
  .muted{font-size:12px;color:#6b7280;margin-top:14px}
</style></head>
<body><div class="box" id="box">
  <img src="build/icon.png" alt="">
  <h2 id="t">서버에 연결하는 중…</h2>
  <p id="m">서버가 잠들어 있었다면 깨어나는 데 30초쯤 걸릴 수 있습니다.</p>
  <div class="bar"><i></i></div>
  <button id="retry" hidden>다시 시도</button>
  <div class="muted" id="u"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('u').textContent = q.get('server') || '';
  if (q.get('err')) {
    document.getElementById('box').classList.add('err');
    document.getElementById('t').textContent = '서버에 닿지 않습니다';
    document.getElementById('m').textContent = '인터넷 연결을 확인해 주세요. 잠시 뒤 저절로 다시 시도합니다.';
    document.getElementById('retry').hidden = false;
  }
  document.getElementById('retry').onclick = function () { window.wmDesktop && window.wmDesktop.retry(); };
</script>
</body></html>
