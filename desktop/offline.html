<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>업무 관리자</title>
<style>
  /* v13.384 PC 앱 첫 화면 — 웹 시작 화면(인트로)과 같은 로고 · 배경. 서버에 닿으면 바로 웹 화면으로 넘어감 */
  html,body{height:100%;margin:0}
  body{font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;background:radial-gradient(120% 90% at 50% 38%,#18203d 0%,#0b0f1c 62%);color:#e5e7eb;display:grid;place-items:center;user-select:none;overflow:hidden}
  .au{position:fixed;inset:-20%;filter:blur(80px);opacity:.45;pointer-events:none}
  .au i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;mix-blend-mode:screen;animation:dr 18s ease-in-out infinite alternate}
  .au i:nth-child(1){left:6%;top:8%;background:radial-gradient(circle,#5865F2 0%,transparent 64%)}
  .au i:nth-child(2){right:2%;top:30%;background:radial-gradient(circle,#8B5CF6 0%,transparent 64%);animation-duration:22s;animation-delay:-7s}
  .au i:nth-child(3){left:28%;bottom:-6%;background:radial-gradient(circle,#06B6D4 0%,transparent 64%);animation-duration:26s;animation-delay:-13s}
  .dots{position:fixed;inset:0;background-image:radial-gradient(rgba(148,163,184,.5) 1px,transparent 1.4px);background-size:26px 26px;opacity:.2;-webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 0%,transparent 60%);pointer-events:none}
  .box{position:relative;text-align:center;max-width:420px;padding:24px}
  .logo{width:100px;height:100px;margin:0 auto 22px;position:relative;animation:fl 4.8s ease-in-out 1.6s infinite}
  .logo::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(88,101,242,.45) 0%,transparent 66%);animation:gl 3.2s ease-in-out .9s infinite;opacity:0}
  svg{position:relative;width:100%;height:100%;overflow:visible}
  .ln{fill:none;stroke:url(#g);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dw 1s cubic-bezier(.65,0,.35,1) .1s forwards}
  .fi{fill:url(#g);opacity:0;transform-box:fill-box;transform-origin:center;animation:fi .6s cubic-bezier(.2,.8,.2,1) .85s forwards;filter:drop-shadow(0 10px 22px rgba(88,101,242,.55))}
  .tk{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dw .5s cubic-bezier(.65,0,.35,1) 1.25s forwards}
  h2{margin:0 0 8px;font-size:23px;font-weight:800;letter-spacing:-.5px;color:#fff;opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) .6s forwards}
  p{color:#9ca3af;font-size:13px;line-height:1.6;margin:0 0 18px;opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) .9s forwards}
  .bar{position:relative;height:3px;border-radius:3px;background:rgba(148,163,184,.18);overflow:hidden;margin:0 auto 18px;width:220px;opacity:0;animation:fd .5s ease 1.1s forwards}
  .bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#8B5CF6,#5865F2,#06B6D4);box-shadow:0 0 10px rgba(88,101,242,.7);animation:mv 1.3s ease-in-out infinite}
  button{padding:11px 24px;border-radius:12px;border:0;background:linear-gradient(135deg,#5865F2,#7C3AED);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 12px 26px -12px rgba(88,101,242,.9)}
  button:hover{filter:brightness(1.08)}
  .err .bar{display:none}
  .muted{font-size:11px;color:#6b7280;margin-top:14px;opacity:0;animation:fd .5s ease 1.3s forwards}
  @keyframes dr{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-4vmax) scale(1.15)}100%{transform:translate(-5vmax,5vmax) scale(.95)}}
  @keyframes dw{to{stroke-dashoffset:0}}
  @keyframes fi{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
  @keyframes gl{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.8;transform:scale(1.06)}}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fd{to{opacity:1}}
  @keyframes mv{0%{left:-40%}100%{left:100%}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.ln,.tk{stroke-dashoffset:0}.fi,h2,p,.bar,.muted{opacity:1}}
</style></head>
<body><div class="au"><i></i><i></i><i></i></div><div class="dots"></div>
<div class="box" id="box">
  <div class="logo"><svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865F2"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
    <g transform="rotate(45 48 48)"><rect class="fi" x="22" y="22" width="52" height="52" rx="14"/></g>
    <rect class="ln" x="22" y="22" width="52" height="52" rx="14" transform="rotate(45 48 48)" pathLength="100"/>
    <path class="tk" d="M36 49 l8 8 l17 -18" pathLength="100"/></svg></div>
  <h2 id="t">업무 관리자</h2>
  <p id="m">서버에 연결하는 중… 잠들어 있었다면 30초쯤 걸릴 수 있어요</p>
  <div class="bar"><i></i></div>
  <button id="retry" hidden>다시 시도</button>
  <div class="muted" id="u"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('u').textContent = q.get('server') || '';
  if (q.get('err')) {
    document.getElementById('box').classList.add('err');
    document.getElementById('t').textContent = '서버에 닿지 않습니다';
    document.getElementById('m').textContent = '인터넷 연결을 확인해 주세요. 잠시 뒤 저절로 다시 시도합니다.';
    document.getElementById('retry').hidden = false;
  }
  document.getElementById('retry').onclick = function () { window.wmDesktop && window.wmDesktop.retry(); };
</script>
</body></html>
